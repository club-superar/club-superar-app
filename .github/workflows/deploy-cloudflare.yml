name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configure Gemini runtime secret
        run: echo "$GEMINI_API_KEY" | pnpm dlx wrangler@4.68.0 secret put GEMINI_API_KEY --name club-superar-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Deploy Club SUPER.AR
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Keep the deployment tool deterministic. Newer Wrangler releases
          # auto-provision an OpenNext R2 cache that this project does not use.
          wranglerVersion: "4.68.0"
          command: deploy
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PARTICIPANT_EMAIL_DOMAIN: ${{ secrets.PARTICIPANT_EMAIL_DOMAIN }}
          RECOVERY_CODE_PEPPER: ${{ secrets.RECOVERY_CODE_PEPPER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
